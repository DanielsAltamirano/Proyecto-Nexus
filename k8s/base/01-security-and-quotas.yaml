# ==============================================================================
# 01-security-and-quotas.yaml
# Controles Iniciales, Seguridad (PSA Restricted), Cuotas, RBAC y ConfigMap
# Proyecto: Nexus ERP
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-base
  labels:
    app.kubernetes.io/part-of: nexus-erp
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# ==============================================================================
# ResourceQuota - Límites globales de consumo en el Namespace
# ==============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nexus-resource-quota
  labels:
    app.kubernetes.io/part-of: nexus-erp
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    persistentvolumeclaims: "5"
    pods: "20"
    services: "10"
---
# ==============================================================================
# LimitRange - Límites por defecto, mínimos y máximos por Contenedor
# ==============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: nexus-limit-range
  labels:
    app.kubernetes.io/part-of: nexus-erp
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      min:
        cpu: 25m
        memory: 32Mi
      max:
        cpu: "2"
        memory: 2Gi
---
# ==============================================================================
# ServiceAccounts con automountServiceAccountToken: false (Seguridad Zero-Trust)
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-app-sa
  labels:
    app.kubernetes.io/part-of: nexus-erp
    app.kubernetes.io/component: application
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-db-sa
  labels:
    app.kubernetes.io/part-of: nexus-erp
    app.kubernetes.io/component: database
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-backup-sa
  labels:
    app.kubernetes.io/part-of: nexus-erp
    app.kubernetes.io/component: backup
automountServiceAccountToken: false
---
# ==============================================================================
# RBAC de Mínimo Privilegio (Roles y RoleBindings por Componente)
# ==============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-app-role
  labels:
    app.kubernetes.io/part-of: nexus-erp
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["nexus-config", "nexus-nginx-config"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-app-rolebinding
  labels:
    app.kubernetes.io/part-of: nexus-erp
subjects:
  - kind: ServiceAccount
    name: nexus-app-sa
roleRef:
  kind: Role
  name: nexus-app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-db-role
  labels:
    app.kubernetes.io/part-of: nexus-erp
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-db-rolebinding
  labels:
    app.kubernetes.io/part-of: nexus-erp
subjects:
  - kind: ServiceAccount
    name: nexus-db-sa
roleRef:
  kind: Role
  name: nexus-db-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-backup-role
  labels:
    app.kubernetes.io/part-of: nexus-erp
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-backup-rolebinding
  labels:
    app.kubernetes.io/part-of: nexus-erp
subjects:
  - kind: ServiceAccount
    name: nexus-backup-sa
roleRef:
  kind: Role
  name: nexus-backup-role
  apiGroup: rbac.authorization.k8s.io
---
# ==============================================================================
# ConfigMap (nexus-config) - Variables No Sensibles de Laravel y Nginx
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  labels:
    app.kubernetes.io/part-of: nexus-erp
data:
  APP_NAME: "Nexus ERP"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://prod.nexus.internal"
  APP_LOCALE: "es"
  APP_FALLBACK_LOCALE: "en"
  APP_FAKER_LOCALE: "es_MX"
  APP_MAINTENANCE_DRIVER: "file"
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: "stderr"
  LOG_STACK: "single"
  LOG_LEVEL: "info"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-svc"
  DB_PORT: "3306"
  DB_DATABASE: "nexus_db"
  MONGODB_HOST: "mongodb-svc"
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: "nexus_audit"
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: "/"
  SESSION_CONNECTION: "mysql"
  SESSION_TABLE: "sessions"
  BROADCAST_CONNECTION: "log"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  DB_CACHE_CONNECTION: "mysql"
  DB_CACHE_TABLE: "cache"
  PHP_FPM_HOST: "nexus-backend-svc"
---
# ==============================================================================
# ConfigMap (nexus-nginx-config) - Configuración FastCGI hacia nexus-backend-svc:9000
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-nginx-config
  labels:
    app.kubernetes.io/part-of: nexus-erp
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;
        client_max_body_size 20M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass nexus-backend-svc:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }

